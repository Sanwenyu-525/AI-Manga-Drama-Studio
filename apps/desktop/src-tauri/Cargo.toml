[package]
name = "ai-manga-studio"
version = "0.1.0"
description = "AI Manga Drama Studio — AI-native manga drama production desktop app"
edition = "2021"

[lib]
name = "ai_manga_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
