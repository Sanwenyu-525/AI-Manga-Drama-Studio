[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",  # ComfyUI client (P1-E2-T01: explicit runtime dep)
    "langchain-core>=1.5.4",
    "langchain-openai>=1.5.0",
    "langgraph>=1.2.11",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
    "websockets>=15.0",  # ComfyUI WS monitor (P1-E2-T01: explicit runtime dep)
    "edge-tts>=7.0.0",  # TTS voiceover provider (TASK-012: high-star LGPL pkg, online voices)
    "mcp>=1.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "ASYNC"]
ignore = [
  "E501",   # long lines allowed (line-length only guides the formatter)
  "B008",   # FastAPI Depends() in argument defaults is the framework pattern
  "S101",   # assert is used in tests
  "S311",   # random.randint for seeds is fine (no crypto)
  "S324",   # md5 for deterministic mock colors is fine (no crypto)
]

