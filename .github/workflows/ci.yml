name: CI

# P1-E6-T01: risk-driven test baseline — PR 必须通过全部门禁：
# Alembic-from-zero 迁移、pytest、ruff、前端 typecheck/build/组件测试、Cargo check、
# secret 扫描。不要求普通 PR 连接 GPU、真实 LLM 或用户 ComfyUI。

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: cd backend && uv sync --locked
      - name: Lint (ruff)
        run: cd backend && uv run ruff check app tests
      - name: "Test (pytest: Alembic-from-zero + worker loop + risk suites)"
        run: cd backend && uv run pytest -q
      - name: Secret scan
        run: python scripts/scan-secrets.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: cd frontend && npm ci
      - name: Typecheck + build
        run: cd frontend && npm run build
      - name: Lint (eslint)
        run: cd frontend && npm run lint
      - name: Format check (prettier)
        run: cd frontend && npm run format:check
      - name: Component / store / contract tests
        run: cd frontend && npm test

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend deps (uv)
        run: cd backend && uv sync --locked
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: E2E smoke (fake/mock main path)
        run: cd frontend && npm run test:e2e

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check (Tauri shell)
        run: cd apps/desktop/src-tauri && cargo check
